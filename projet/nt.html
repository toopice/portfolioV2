<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="nt.css">
    <title>Une question importante ♥</title>
</head>
<body>

    <div class="petals" id="petals"></div>

    <div class="card">
        <span class="heart-top">♥</span>
        <h1>Veux-tu te mettre<br>en couple avec moi ?</h1>

        <div class="choices" id="choices">
            <button class="btn-oui" id="btn-oui" onclick="repondre('oui')">Oui ♥</button>
            <button class="btn-non" id="btn-non" onclick="swapNon()">Non</button>
        </div>

        <p class="message" id="message"></p>
    </div>

    <script>
        // Pétales qui tombent
        const petals = document.getElementById('petals');
        const emojis = ['♥', '🌸', '✿', '♡'];
        for (let i = 0; i < 18; i++) {
            const p = document.createElement('div');
            p.className = 'petal';
            p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (4 + Math.random() * 6) + 's';
            p.style.animationDelay = (Math.random() * 8) + 's';
            p.style.fontSize = (14 + Math.random() * 16) + 'px';
            petals.appendChild(p);
        }

        function swapNon() {
            const msg = document.getElementById('message');
            msg.textContent = '';
            msg.classList.remove('visible');
            const btnOui = document.getElementById('btn-oui');
            const btnNon = document.getElementById('btn-non');
            // L'ancien "oui" devient "non", l'ancien "non" devient "oui"
            btnOui.className = 'btn-non';
            btnOui.id = 'btn-non-tmp';
            btnOui.textContent = 'Non';
            btnOui.onclick = swapNon;

            btnNon.className = 'btn-oui';
            btnNon.id = 'btn-oui';
            btnNon.textContent = 'Oui ♥';
            btnNon.onclick = function() { repondre('oui'); };

            btnOui.id = 'btn-non';
        }

        function repondre(rep) {
            const msg = document.getElementById('message');
            msg.textContent = '!🕺YESSS🕺!';
            msg.classList.add('visible');
            exploserFleurs();
        }

        function exploserFleurs() {
            const fleurs = ['🌸','🌺','🌼','🌻','💐','🌹','🌷','✿','💮'];
            const total = 120;
            for (let i = 0; i < total; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.textContent = fleurs[Math.floor(Math.random() * fleurs.length)];
                    const startX = Math.random() * window.innerWidth;
                    const startY = window.innerHeight * (0.4 + Math.random() * 0.2);
                    const tx = (Math.random() - 0.5) * 400;
                    const ty = -120 - Math.random() * 600;
                    const rot = (Math.random() - 0.5) * 720;
                    const duration = 900 + Math.random() * 1400;
                    const size = 20 + Math.random() * 40;

                    el.style.position = 'fixed';
                    el.style.left = startX + 'px';
                    el.style.top = startY + 'px';
                    el.style.fontSize = size + 'px';
                    el.style.pointerEvents = 'none';
                    el.style.zIndex = '9999';
                    el.style.opacity = '1';
                    el.style.transform = 'translate(0,0) rotate(0deg) scale(0.5)';
                    el.style.transition = `transform ${duration}ms cubic-bezier(0.25,0.46,0.45,0.94), opacity ${duration}ms ease`;
                    document.body.appendChild(el);

                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            el.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(1.2)`;
                            el.style.opacity = '0';
                        });
                    });

                    setTimeout(() => el.remove(), duration + 100);
                }, i * 15);
            }
        }
    </script>

</body>
</html>
