<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="nt.css">
    <title>Une question importante ♥</title>
</head>
<body>

    <div class="petals" id="petals"></div>

    <div class="card">
        <span class="heart-top">♥</span>
        <h1>Veux-tu te mettre<br>en couple avec moi ?</h1>

        <div class="choices" id="choices">
            <button class="btn-oui" id="btn-oui" onclick="repondre('oui')">Oui ♥</button>
            <button class="btn-non" id="btn-non" onclick="swapNon()">Non</button>
        </div>

        <p class="message" id="message"></p>
    </div>

    <script>
        // Pétales qui tombent
        const petals = document.getElementById('petals');
        const emojis = ['♥', '🌸', '✿', '♡'];
        for (let i = 0; i < 18; i++) {
            const p = document.createElement('div');
            p.className = 'petal';
            p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (4 + Math.random() * 6) + 's';
            p.style.animationDelay = (Math.random() * 8) + 's';
            p.style.fontSize = (14 + Math.random() * 16) + 'px';
            petals.appendChild(p);
        }

        function swapNon() {
            const btnOui = document.getElementById('btn-oui');
            const btnNon = document.getElementById('btn-non');
            // L'ancien "oui" devient "non", l'ancien "non" devient "oui"
            btnOui.className = 'btn-non';
            btnOui.id = 'btn-non-tmp';
            btnOui.textContent = 'Non';
            btnOui.onclick = swapNon;

            btnNon.className = 'btn-oui';
            btnNon.id = 'btn-oui';
            btnNon.textContent = 'Oui ♥';
            btnNon.onclick = function() { repondre('oui'); };

            btnOui.id = 'btn-non';
        }

        function repondre(rep) {
            const msg = document.getElementById('message');
            msg.textContent = '🎉 Je savais que tu dirais oui ! ♥';
            msg.classList.add('visible');
            document.getElementById('btn-oui').disabled = true;
            document.getElementById('btn-non').disabled = true;
        }
    </script>

</body>
</html>
